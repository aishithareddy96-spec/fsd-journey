<!DOCTYPE html>
<html lang="en">
<head>
    <title>Grid Practice</title>
</head>
<body>
    <div style="
        display: grid;
        grid-template-columns: 100px 100px;">
        <div style= "background-color: lightblue;">
            div1
        </div>
        <div style= "background-color: lightgreen;">
            div2
        </div>
    </div>
    <div style="
        margin-top: 20px;
        display: grid;
        grid-template-columns: 100px 100px 200px;">
        <div style= "background-color: lightblue;">
            div1
        </div>
        <div style= "background-color: lightgreen;">
            div2
        </div>
        <div style= "background-color: lightcoral;">
            div3
        </div>
    </div>
    <div style="
        margin-top: 20px;
        display: grid;
        grid-template-columns: 100px 1fr;">
        <div style= "background-color: lightblue;">
            div1
        </div>
        <div style= "background-color: lightgreen;">
            div2
        </div>
    </div>

    <div style="
        margin-top: 20px;
        display: grid;
        grid-template-columns: 100px 1fr 1fr;">
        <div style= "background-color: lightblue;">
            div1
        </div>
        <div style= "background-color: lightgreen;">
            div2
        </div>
        <div style= "background-color: rgb(228, 230, 173);">
            div3
        </div>
    </div>
</body>
</html>
